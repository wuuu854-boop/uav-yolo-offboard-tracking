# Camera intrinsics for PX4's `x500_mono_cam_down` model.
#
# Source of truth: models/mono_cam/model.sdf in PX4/PX4-gazebo-models
#   <horizontal_fov>1.74</horizontal_fov>   (rad, ~99.7 deg)
#   <width>1280</width> <height>960</height>
#   <sensor name="camera"> in <link name="camera_link">
#
#   fx = (W/2) / tan(HFOV/2) = 640 / tan(0.87) = 538.4
#   fy = fx                      (square pixels)
#
# If you change the model, resolution or FOV you MUST recompute these; the
# projection error grows linearly with altitude (see docs/scenario.md).
#
# WARNING: the similarly named `x500_mono_cam` (without _down) is a FORWARD
# looking camera at pose (.12 .03 .242) with no rotation. Using it here gives a
# horizon view and the ground projection is meaningless. See troubleshooting #10.
image_width: 1280
image_height: 960
fx: 538.4
fy: 538.4
cx: 640.0
cy: 480.0

# Nadir camera mounting. true = image "up" points to body forward.
# `x500_mono_cam_down` mounts `mono_cam` with a +90 deg pitch about y, which
# puts the optical axis on body -z (down) and the image top towards body +x.
# Getting this wrong mirrors the target along one axis; verify with one known
# target before flying the full mission.
image_up_is_forward: false

# Camera optical centre relative to the vehicle origin, metres, body FLU
# (x forward, y left, z up) as used by the Gazebo model.
# `x500_mono_cam_down` places the camera at (0, 0, 0.10), i.e. 10 cm above
# base_link. v0.1.0 applies this offset in estimate_target_enu().
mount_offset_xyz: [0.0, 0.0, 0.10]

# Optical-axis tilt from body -z. The MVP only supports 0.0 (strict nadir).
tilt_deg: 0.0
