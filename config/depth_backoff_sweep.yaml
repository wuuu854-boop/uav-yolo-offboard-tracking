# Depth gate for the phase-6 repeated-backoff scenario (`make backoff-sweep`).
#
# The 6.0 m floor makes the 4 m barrier blocked at the stop; at 0.2 m steps the
# strips stay below 6.0 m for the first two steps and clear on the third. If the
# sweep budget runs out, the planner holds.
stop_distance_m: 2.5
clear_distance_m: 3.2

roi_width_fraction: 0.6
roi_height_fraction: 0.5
roi_center_x: 0.5
roi_center_y: 0.5

min_valid_m: 0.25
max_valid_m: 12.0

side_width_fraction: 0.2
side_margin_m: 0.5
min_clear_side_m: 6.0

stale_timeout_s: 0.5
fail_safe_on_stale: true

publish_rate_hz: 10.0
