# Mission used by the phase-8 side-search flight (`make search`).
#
# Phase 8 uses target_tracking_search.sdf: two 6 m pillars at (-1.5, +/-1.5) make
# both side strips read blocked at the 4.0 m floor. No back-off: the planner
# side-steps 2 m toward the freer side directly from the stop, re-reads, and
# takes a second 2 m step if still blocked. The forward leg is 7.5 m so the L
# starts northeast of the pillars.
takeoff_altitude_m: 5.0
spawn_offset_enu: [-7.5, 0.0]
reach_tolerance_m: 1.0
max_speed_mps: 0.6
hover_duration_s: 3.0

target_loss_hover_s: 2.0
setpoint_jump_limit_m: 3.0
land_after_hover: true
max_mission_s: 90.0

confirm_frames: 3
geofence_radius_m: 30.0
control_rate_hz: 50.0

heading_yaw_deg: 90.0

patrol_waypoints:
  - [7.5, 0.0]

target_selection: nearest_centre
search_after_s: 8.0
search_area_m: 20.0
search_spacing_m: 8.9

avoidance_timeout_s: 1.0

detour_enabled: true
detour_side: right
detour_auto_side: true
detour_offset_m: 3.5
detour_forward_m: 7.5
detour_reach_tolerance_m: 0.05
detour_min_lateral_m: 3.0
detour_clear_hold_s: 1.0
detour_wait_timeout_s: 5.0
detour_max_attempts: 2
detour_start_delay_s: 1.0
detour_backoff_m: 0.0
detour_backoff_max_attempts: 1
detour_search_step_m: 2.0
detour_search_max_attempts: 2
detour_min_clearance_m: 0.4
