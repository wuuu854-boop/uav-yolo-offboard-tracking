# Mission parameters. Every value here ends up in the report, so change them
# consciously and record the change in docs/experiment-protocol.md.
takeoff_altitude_m: 5.0
reach_tolerance_m: 1.0
max_speed_mps: 1.0
hover_duration_s: 10.0

# Safety behaviour.
target_loss_hover_s: 2.0      # no /target_pose for this long -> hover in place
setpoint_jump_limit_m: 3.0    # reject targets that jump more than this between frames
land_after_hover: true

control_rate_hz: 50

# Which detection to follow when more than one is in the frame:
#   nearest_centre    - closest to the image centre (default; the vehicle is
#                       usually already pointed at what it should approach)
#   nearest_previous  - closest to the last selected box (tracks one object)
#   highest_confidence - the obvious choice, and often a distant edge object
#   tracked           - follow the track_id the mission locked onto, falling
#                       back to nearest_centre if it disappears
target_selection: nearest_centre

# When the target has been lost for this long after hovering, sweep the area
# around the last known position instead of hovering forever. Lane spacing below
# is coverage_spacing(11.9 m footprint, 0.25 overlap) from docs/scenario.md.
search_after_s: 8.0
search_area_m: 20.0
search_spacing_m: 8.9
