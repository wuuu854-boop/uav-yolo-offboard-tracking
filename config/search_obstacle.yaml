# Side pillars in target_tracking_search.sdf (phase 8).
#
# Two 0.8 x 0.8 x 6.0 m pillars at (-1.5, -0.8) and (-1.5, +1.8), clear of the
# wall. They sit at about +/-27 deg from the stop camera, inside the two side
# strips; both read about 3 m, inside the 4.0 m floor. A 2 m side-step moves past
# one of them and clears.
model: search_right
pose_enu: [-1.5, -0.8, 3.0]
size_m: [0.8, 0.8, 6.0]
right_block:
  model: search_right
  pose_enu: [-1.5, -0.8, 3.0]
  size_m: [0.8, 0.8, 6.0]
left_block:
  model: search_left
  pose_enu: [-1.5, 1.8, 3.0]
  size_m: [0.8, 0.8, 6.0]
