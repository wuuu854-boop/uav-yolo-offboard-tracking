model: search_right
pose_enu: [-1.5, -1.5, 3.0]
size_m: [0.8, 0.8, 6.0]
right_block:
  model: search_right
  pose_enu: [-1.5, -1.5, 3.0]
  size_m: [0.8, 0.8, 6.0]
left_block:
  model: search_left
  pose_enu: [-1.5, 1.5, 3.0]
  size_m: [0.8, 0.8, 6.0]
