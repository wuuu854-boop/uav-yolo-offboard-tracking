# Rotated-wall known-map demo (`make global-rotated`).
#
# The wall is rotated 30 deg about z in the world; the planner gets one rotated
# box (the fifth field is the yaw). The report's clearance uses the conservative
# axis-aligned bound in config/rotated_obstacle.yaml, not the rotated shape.
takeoff_altitude_m: 5.0
spawn_offset_enu: [-7.5, 0.0]
reach_tolerance_m: 0.1
max_speed_mps: 0.6
hover_duration_s: 3.0

target_loss_hover_s: 2.0
setpoint_jump_limit_m: 3.0
land_after_hover: true
max_mission_s: 60.0

confirm_frames: 3
geofence_radius_m: 30.0
control_rate_hz: 50.0

heading_yaw_deg: 90.0

patrol_waypoints:
  - [8.2, 0.0]

target_selection: nearest_centre
search_after_s: 8.0
search_area_m: 20.0
search_spacing_m: 8.9

avoidance_timeout_s: 1.0
avoidance_stop_enabled: false
detour_enabled: false

global_planning: true
global_bounds: [-10.0, 10.0, -10.0, 10.0]
global_obstacles:
  # local centre = world (-0.8, 0) - spawn (-7.5, 0); 30 deg about z.
  - [6.7, 0.0, 0.2, 3.0, 0.5236]
global_resolution_m: 0.2
global_inflation_m: 0.5
global_waypoint_tolerance_m: 0.2
global_pre_goal: [8.2, 0.0]
global_min_clearance_m: 0.4
