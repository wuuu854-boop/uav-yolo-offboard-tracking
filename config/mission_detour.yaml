# Mission used by the phase-2 lateral detour flight (`make detour`).
#
# Same wall and spawn as config/mission_avoidance.yaml, with the detour enabled.
# The vehicle stops at the wall, flies 3.5 m to the right (south), then 5 m
# forward past the wall's east face, and resumes the waypoint once the depth gate
# has been clear for a second. The forward leg is why this is an L, not a
# diagonal: the target stands 0.8 m behind the wall, so a diagonal resume from a
# short lateral leg cuts the corner. Five metres puts the forward point ~2 m east
# of the wall face; the final approach to the target then stays east of it.
#
# This is still one fixed side and one obstacle; it is not a planner. See
# docs/detour.md for the limits.
takeoff_altitude_m: 5.0
spawn_offset_enu: [-7.5, 0.0]
reach_tolerance_m: 1.0
max_speed_mps: 0.6
hover_duration_s: 3.0

target_loss_hover_s: 2.0
setpoint_jump_limit_m: 3.0
land_after_hover: true
# Takeoff (~8 s) + approach (~5 s) + 7 m lateral (~12 s) + diagonal return
# (~12 s) + hover/land. 75 s leaves room for the slower parts.
max_mission_s: 75.0

confirm_frames: 3
geofence_radius_m: 30.0
control_rate_hz: 50.0

# East, clockwise from north; the forward depth camera faces the wall.
heading_yaw_deg: 90.0

# A patrol leg to target_0, local ENU (east, north) relative to the spawn.
patrol_waypoints:
  - [7.5, 0.0]

target_selection: nearest_centre
search_after_s: 8.0
search_area_m: 20.0
search_spacing_m: 8.9

# Hold if the stop stream goes quiet after being seen.
avoidance_timeout_s: 1.0

# Phase 2: an L-shaped leg with a fixed side.
detour_enabled: true
detour_side: right
detour_offset_m: 3.5
detour_forward_m: 5.0
detour_reach_tolerance_m: 0.5
# Acceptance for the report: the lateral leg must clear the wall half-width
# (1.5 m) plus the airframe. The planner's actual leg is 3.5 m.
detour_min_lateral_m: 3.0
detour_clear_hold_s: 1.0
detour_wait_timeout_s: 5.0
detour_max_attempts: 2

# The target is 0.7 m from the wall face by construction, so the phase-1 1.0 m
# stop clearance cannot be required after a successful detour. This is the
# airframe-clearance floor for this run; the contact sensor is the primary check.
detour_min_clearance_m: 0.4
