name: ROS build

# Verifies the half of the code base that the unit tests cannot touch: that the
# ROS 2 packages build and that both nodes import against real message
# definitions.
#
# Runs inside the official ROS image instead of using ros-tooling/setup-ros:
# that action downloads its installer from raw.githubusercontent.com, which
# returned 504 on every attempt. Manual dispatch only while it is being brought
# up, so a red run never lands on main.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/ros/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ros.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/ros/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ros.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip git cmake build-essential \
            ros-humble-cv-bridge ros-humble-rosidl-default-generators \
            python3-colcon-common-extensions \
            libgl1 libglib2.0-0
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Build px4_msgs and the interfaces package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          mkdir -p ros_ws/src
          cp -r src/uav_interfaces ros_ws/src/
          git clone --depth 1 --branch release/1.15 https://github.com/PX4/px4_msgs.git ros_ws/src/px4_msgs
          cd ros_ws
          colcon build --packages-select px4_msgs uav_interfaces

      - name: Import both nodes against the built interfaces
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros_ws/install/setup.bash
          export PYTHONPATH="$PWD/src:$PYTHONPATH"
          python3 -c "
          import uav_tracking.perception.detector_node as detector
          import uav_tracking.control.offboard_node as offboard
          print('detector:', detector.DetectorNode.__name__)
          print('offboard:', offboard.OffboardNode.__name__)
          print('imports ok')
          "

      - name: Trial script preflight (no simulator)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros_ws/install/setup.bash
          export PYTHONPATH="$PWD/src:$PYTHONPATH"
          bash scripts/run_e2e.sh --dry-run

      - name: Node-level integration test (rclpy, real messages)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros_ws/install/setup.bash
          export PYTHONPATH="$PWD/src:$PYTHONPATH"
          python3 -m pytest tests/ros -q

      - name: Install the package and import it from outside the repository
        run: |
          python3 -m pip install -e . --no-deps
          cd /tmp && python3 -c "
          import uav_tracking.control.offline_sim as sim
          import uav_tracking.perception.projection as projection
          print('installed package imports ok:', sim.__name__, projection.__name__)
          "
