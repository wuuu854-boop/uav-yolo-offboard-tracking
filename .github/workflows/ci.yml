name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # The image exists for people who would rather not install ROS by hand, so
      # it is built and the unit tests are run inside it on every push. An
      # untested Dockerfile is a promise nobody checked.
      - name: Build the image
        run: docker build -t uav-tracking:ci .

      - name: Unit tests inside the image
        run: docker run --rm uav-tracking:ci python3 -m pytest -q

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Environment doctor (static checks only)
        run: python scripts/doctor.py --static

      - name: World and ground truth agree
        run: python scripts/check_world_targets.py

      - name: Documentation links
        run: python scripts/check_links.py

      - name: README claims match reality
        run: python scripts/check_doc_claims.py

      - name: Unit tests
        run: pytest -q --cov=uav_tracking --cov-report=term-missing
