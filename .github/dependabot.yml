version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # numpy is pinned below 2.0 on purpose (cv_bridge ABI), and opencv follows it;
    # the lock file is regenerated by hand after those two are reviewed.
    ignore:
      - dependency-name: numpy
        versions: [">=2.0"]
      - dependency-name: opencv-python
        versions: [">=4.11"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
