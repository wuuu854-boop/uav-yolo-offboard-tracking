[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-tracking"
version = "0.1.0"
description = "PX4 + Gazebo + ROS 2 closed-loop UAV vision pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python>=4.9,<5.0",
    "onnxruntime>=1.17,<2.0",
    "PyYAML>=6.0,<7.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["uav_tracking*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "install", "log", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Nodes and demo scripts put src/ on sys.path before importing the package, so
# their imports are not at the top.
"src/**/*_node.py" = ["E402"]
"scripts/offline_demo.py" = ["E402"]
"scripts/detect_images.py" = ["E402"]

[tool.pytest.ini_options]
# "." for scripts/, "src" for the uav_tracking package.
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
