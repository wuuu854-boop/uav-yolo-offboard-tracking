[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-tracking"
version = "0.35.0"
description = "PX4 + Gazebo + ROS 2 closed-loop UAV vision pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.0",
    # headless: the GUI wheel links libGL, which CI containers and headless SITL
    # machines do not have. This list must match requirements.txt.
    "opencv-python-headless>=4.9,<4.11",
    "onnxruntime>=1.17,<2.0",
    "PyYAML>=6.0,<7.0",
    # read-only MAVLink telemetry mirror (scripts/mavlink_bridge.py)
    "pymavlink>=2.4,<3.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["uav_tracking*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "install", "log", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Nodes and demo scripts put src/ on sys.path before importing the package, so
# their imports are not at the top.
"src/**/*_node.py" = ["E402"]
"scripts/offline_demo.py" = ["E402"]
"scripts/detect_images.py" = ["E402"]

[tool.pytest.ini_options]
# "." for scripts/, "src" for the uav_tracking package.
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# The two ROS nodes need rclpy and a running middleware; they are exercised by
# the `ROS build` workflow instead, so they are excluded from the unit-coverage
# gate rather than dragging it to zero.
omit = ["*/detector_node.py", "*/offboard_node.py", "*/depth_node.py"]
source = ["uav_tracking"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
